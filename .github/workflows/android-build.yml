
name: CBTA Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p project-unpacked
          unzip -q CBTA-Video-Downloader.zip -d project-unpacked

          PROJECT_DIR="$(find project-unpacked -name settings.gradle.kts -type f -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Upload extracted source code
        uses: actions/upload-artifact@v4
        with:
          name: CBTA-Video-Downloader-Source
          path: project-unpacked/
          if-no-files-found: error

      - name: Repair and validate XML files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          project_dir = Path("project-unpacked")

          xml_files = list(project_dir.rglob("*.xml"))

          if not xml_files:
              raise SystemExit("ERROR: No XML files were found.")

          for path in xml_files:
              try:
                  content = path.read_text(encoding="utf-8-sig")

                  content = re.sub(
                      r'<\?xml\b.*?\?>',
                      '',
                      content,
                      flags=re.IGNORECASE | re.DOTALL
                  )

                  content = content.lstrip()

                  content = (
                      '<?xml version="1.0" encoding="utf-8"?>\n'
                      + content
                  )

                  path.write_text(content, encoding="utf-8")

                  ET.parse(path)

                  print(f"XML OK: {path}")

              except Exception as error:
                  raise SystemExit(
                      f"ERROR in XML file {path}: {error}"
                  )

          print(f"Successfully checked {len(xml_files)} XML files.")
          PY

      - name: Build Android APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CBTA-Video-Downloader-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
